<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060a12" />
    <title>ADS-B Scope</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23060a12' stroke='%2334e2b0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%2334e2b0'/%3E%3Cpath d='M16 16 L16 3 A13 13 0 0 1 27 10 Z' fill='%2334e2b0' fill-opacity='0.35'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/theme.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-columns: 336px 1fr;
        height: 100vh;
      }
      #sidebar {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--border);
        background: var(--panel);
      }
      #sidebar header {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      #sidebar header .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      #sidebar header .feed-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        width: 100%;
      }
      #sidebar header .toolbar {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      #search-input {
        flex: 1;
        min-width: 0;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 8px;
      }
      #search-input:focus {
        outline: none;
        border-color: var(--accent-dim);
      }
      #sort-select {
        color-scheme: dark;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        padding: 6px 4px;
      }
      .toggle-row {
        display: flex;
        gap: 12px;
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .toggle-row label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .toggle-row input[type="checkbox"] {
        accent-color: var(--accent);
      }
      .scroll-area {
        flex: 1;
        overflow: auto;
      }
      .section-title {
        position: sticky;
        top: 0;
        padding: 8px 14px;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--panel);
        border-bottom: 1px solid var(--border-soft);
        display: flex;
        justify-content: space-between;
        z-index: 2;
      }
      .feeder-row,
      .ac-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 14px;
        font-size: 12px;
        font-family: var(--mono);
        border-bottom: 1px solid transparent;
      }
      .feeder-row span:first-child {
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        font-size: 11px;
      }
      .feeder-row span:last-child {
        color: var(--text);
      }
      .ac-row {
        cursor: pointer;
        border-bottom: 1px solid var(--border-soft);
      }
      .ac-row:hover {
        background: var(--panel-alt);
      }
      .ac-row.selected {
        background: #0f2019;
        border-color: var(--accent-dim);
      }
      .ac-row .swatch {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
        box-shadow: 0 0 6px currentColor;
      }
      .ac-row .cs {
        flex: 1;
        color: #f4f8ff;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ac-row .alt {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .ac-row {
        flex-wrap: wrap;
      }
      .ac-row .sub {
        flex-basis: 100%;
        color: var(--muted);
        font-size: 10.5px;
        padding-left: 15px;
      }
      .ac-row .sub .emergency {
        color: var(--danger);
        font-weight: 700;
      }
      #empty-state {
        padding: 24px 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
      }
      #map-wrap {
        position: relative;
      }
      #map {
        height: 100vh;
        width: 100%;
        background: #060a12;
      }
      #legend {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 500;
        background: rgba(13, 21, 38, 0.9);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        backdrop-filter: blur(4px);
      }
      #legend .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
        white-space: nowrap;
      }
      #legend .sw {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      /* Aircraft marker + leaflet popup skin. */
      .plane-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.9));
      }
      .plane-icon svg {
        display: block;
      }
      .plane-icon.stale {
        opacity: 0.45;
        filter: grayscale(0.6);
      }
      .leaflet-popup-content-wrapper {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
      .leaflet-popup-tip {
        background: var(--panel);
        border: 1px solid var(--border);
      }
      .leaflet-popup-content {
        margin: 10px 12px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
      }
      .pop-title {
        font-family: var(--display);
        font-weight: 700;
        font-size: 13px;
        color: var(--accent);
        margin-bottom: 2px;
      }
      .leaflet-container {
        font-family: var(--mono);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <div class="brand">
            <span class="mark"></span>
            <span class="wordmark">ADS-B Scope<small>live traffic feed</small></span>
          </div>
          <div class="status-row">
            <span class="pill" id="count-pill"><span class="dot"></span><span id="ac-count">0</span> aircraft</span>
            <span class="pill down" id="ws-pill"><span class="dot"></span><span id="ws-state">connecting</span></span>
          </div>
          <div class="toolbar">
            <input id="search-input" type="text" placeholder="Filter by callsign or ICAO…" autocomplete="off" />
            <select id="sort-select">
              <option value="callsign">Sort: Callsign</option>
              <option value="altitude">Sort: Altitude</option>
              <option value="speed">Sort: Speed</option>
              <option value="distance">Sort: Distance</option>
            </select>
          </div>
          <div class="toggle-row">
            <label><input type="checkbox" id="trails-toggle" /> trails</label>
            <label><input type="checkbox" id="follow-toggle" /> follow selected</label>
          </div>
          <a href="/feed" class="btn feed-link">📡 How to feed / Cómo enviar datos →</a>
        </header>
        <div class="scroll-area">
          <div class="section-title">Feeders</div>
          <div id="feeders"></div>
          <div class="section-title">
            <span>Aircraft</span>
            <span id="ac-count-2">0</span>
          </div>
          <div id="aircraft-list"></div>
          <div id="empty-state" hidden>No aircraft tracked yet — waiting for feeder data…</div>
        </div>
      </aside>
      <div id="map-wrap">
        <div id="map"></div>
        <div id="legend">
          <div class="row"><span class="sw" style="background:#7d8fb3"></span>ground</div>
          <div class="row"><span class="sw" style="background:#ff5d6c"></span>&lt; 3,000 ft</div>
          <div class="row"><span class="sw" style="background:#f5a623"></span>&lt; 8,000 ft</div>
          <div class="row"><span class="sw" style="background:#34e2b0"></span>&lt; 20,000 ft</div>
          <div class="row"><span class="sw" style="background:#38bdf8"></span>&lt; 35,000 ft</div>
          <div class="row"><span class="sw" style="background:#b18cff"></span>&ge; 35,000 ft</div>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const map = L.map("map", {
        center: [20, 0],
        zoom: 3,
        worldCopyJump: true,
        zoomControl: false,
      });
      L.control.zoom({ position: "bottomleft" }).addTo(map);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 16,
          maxNativeZoom: 16,
          attribution: "© Esri, HERE, Garmin, © OpenStreetMap contributors",
        },
      ).addTo(map);

      const markers = new Map(); // icao -> { marker, ac }
      const trailPoints = new Map(); // icao -> latlng[]
      const trailLayers = new Map(); // icao -> L.Polyline
      let selectedIcao = null;
      let lastList = [];
      let lastNow = Date.now();
      let searchQuery = "";
      let sortMode = "callsign";
      let showTrails = false;
      let followSelected = false;
      let site = null; // { lat, lon, name }
      const listEl = document.getElementById("aircraft-list");
      const emptyEl = document.getElementById("empty-state");
      const countEl = document.getElementById("ac-count");
      const count2El = document.getElementById("ac-count-2");
      const countPillEl = document.getElementById("count-pill");
      const feedersEl = document.getElementById("feeders");
      const wsStateEl = document.getElementById("ws-state");
      const wsPillEl = document.getElementById("ws-pill");
      const searchInput = document.getElementById("search-input");
      const sortSelect = document.getElementById("sort-select");
      const trailsToggle = document.getElementById("trails-toggle");
      const followToggle = document.getElementById("follow-toggle");
      const EMERGENCY_SQUAWKS = new Set(["7500", "7600", "7700"]);

      // Colour-by-altitude, the same convention most ADS-B scopes use.
      function altColor(ac) {
        if (ac.onGround) return "#7d8fb3";
        const alt = ac.altitudeFt;
        if (alt == null) return "#8aa0c9";
        if (alt < 3000) return "#ff5d6c";
        if (alt < 8000) return "#f5a623";
        if (alt < 20000) return "#34e2b0";
        if (alt < 35000) return "#38bdf8";
        return "#b18cff";
      }

      // Great-circle distance (nm) and initial bearing (deg) from the receiver site.
      function distNm(lat1, lon1, lat2, lon2) {
        const R = 3440.065;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }
      function bearingDeg(lat1, lon1, lat2, lon2) {
        const toRad = (d) => (d * Math.PI) / 180;
        const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
        const x =
          Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
          Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
        return (Math.atan2(y, x) * 180) / Math.PI + (Math.atan2(y, x) < 0 ? 360 : 0);
      }
      function vsArrow(fpm) {
        if (fpm === undefined) return "";
        if (fpm > 200) return "▲";
        if (fpm < -200) return "▼";
        return "▬";
      }
      function ageText(lastSeen) {
        const s = Math.max(0, Math.round((lastNow - lastSeen) / 1000));
        return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
      }

      const PLANE_PATH =
        "M12 2c-1.1 0-2 .9-2 2v5.5L2 14v2l8-2.5V19l-2.5 1.5V22l4.5-1 4.5 1v-1.5L14 19v-5.5l8 2.5v-2l-8-4.5V4c0-1.1-.9-2-2-2z";

      function iconFor(ac) {
        const rot = Math.round(ac.trackDeg ?? 0);
        const stale = lastNow - ac.lastSeen > 15000 ? "stale" : "";
        const size = ac.icao === selectedIcao ? 26 : 20;
        return L.divIcon({
          className: "",
          html: `<div class="plane-icon ${stale}" style="color:${altColor(ac)}; transform: rotate(${rot}deg)">
            <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor">
              <path d="${PLANE_PATH}"/>
            </svg>
          </div>`,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        });
      }

      function popupFor(ac) {
        const rows = [];
        if (ac.altitudeFt !== undefined) rows.push(`ALT&nbsp; ${ac.altitudeFt.toLocaleString()} ft`);
        if (ac.groundSpeedKt !== undefined) rows.push(`GS&nbsp;&nbsp; ${ac.groundSpeedKt} kt`);
        if (ac.trackDeg !== undefined) rows.push(`TRK&nbsp; ${ac.trackDeg}°`);
        if (ac.verticalRateFpm !== undefined)
          rows.push(`V/S&nbsp; ${ac.verticalRateFpm} fpm ${vsArrow(ac.verticalRateFpm)}`);
        if (ac._distNm !== undefined) rows.push(`DIST&nbsp; ${ac._distNm.toFixed(1)} nm @ ${Math.round(ac._brg)}°`);
        if (ac.squawk) {
          const emerg = EMERGENCY_SQUAWKS.has(ac.squawk);
          rows.push(`SQK&nbsp; ${ac.squawk}${emerg ? ' <span style="color:var(--danger); font-weight:700;">EMERGENCY</span>' : ""}`);
        }
        rows.push(`MSG&nbsp; ${ac.messages} · updated ${ageText(ac.lastSeen)}`);
        return `<div class="pop-title">${ac.callsign || ac.icao.toUpperCase()}</div>
          <div style="color:var(--muted); font-size:11px; margin-bottom:6px;">ICAO ${ac.icao.toUpperCase()}</div>
          ${rows.join("<br>")}`;
      }

      function updateAircraft(list, now) {
        lastList = list;
        lastNow = now ?? Date.now();
        render();
      }

      function render() {
        const q = searchQuery.trim().toLowerCase();
        let filtered = q
          ? lastList.filter(
              (ac) => (ac.callsign || "").toLowerCase().includes(q) || ac.icao.toLowerCase().includes(q),
            )
          : lastList;

        if (site) {
          for (const ac of filtered) {
            if (ac.lat === undefined || ac.lon === undefined) continue;
            ac._distNm = distNm(site.lat, site.lon, ac.lat, ac.lon);
            ac._brg = bearingDeg(site.lat, site.lon, ac.lat, ac.lon);
          }
        }

        const seen = new Set();
        for (const ac of filtered) {
          if (ac.lat === undefined || ac.lon === undefined) continue;
          seen.add(ac.icao);
          const latlng = [ac.lat, ac.lon];
          let entry = markers.get(ac.icao);
          if (!entry) {
            const marker = L.marker(latlng, { icon: iconFor(ac) }).addTo(map);
            marker.on("click", () => selectAircraft(ac.icao));
            entry = { marker, ac };
            markers.set(ac.icao, entry);
          } else {
            entry.marker.setLatLng(latlng);
            entry.ac = ac;
            entry.marker.setIcon(iconFor(ac));
          }
          entry.marker.bindPopup(popupFor(ac));

          if (showTrails) {
            let pts = trailPoints.get(ac.icao);
            if (!pts) {
              pts = [];
              trailPoints.set(ac.icao, pts);
            }
            const last = pts[pts.length - 1];
            if (!last || last[0] !== latlng[0] || last[1] !== latlng[1]) pts.push(latlng);
            if (pts.length > 30) pts.shift();
            let line = trailLayers.get(ac.icao);
            if (!line) {
              line = L.polyline(pts, { color: altColor(ac), weight: 2, opacity: 0.55 }).addTo(map);
              trailLayers.set(ac.icao, line);
            } else {
              line.setLatLngs(pts);
              line.setStyle({ color: altColor(ac) });
            }
          }

          if (followSelected && ac.icao === selectedIcao) {
            map.panTo(latlng, { animate: true });
          }
        }
        for (const [icao, entry] of markers) {
          if (!seen.has(icao)) {
            map.removeLayer(entry.marker);
            markers.delete(icao);
            const line = trailLayers.get(icao);
            if (line) {
              map.removeLayer(line);
              trailLayers.delete(icao);
            }
            trailPoints.delete(icao);
          }
        }

        countEl.textContent = filtered.length;
        count2El.textContent = filtered.length;
        countPillEl.classList.toggle("live", filtered.length > 0);
        emptyEl.hidden = filtered.length > 0;
        emptyEl.textContent =
          lastList.length === 0
            ? "No aircraft tracked yet — waiting for feeder data…"
            : "No aircraft match your filter.";

        const sorted = filtered.slice().sort((a, b) => {
          if (sortMode === "altitude") return (b.altitudeFt ?? -1) - (a.altitudeFt ?? -1);
          if (sortMode === "speed") return (b.groundSpeedKt ?? -1) - (a.groundSpeedKt ?? -1);
          if (sortMode === "distance") return (a._distNm ?? Infinity) - (b._distNm ?? Infinity);
          return (a.callsign || a.icao).localeCompare(b.callsign || b.icao);
        });

        listEl.innerHTML = sorted
          .map((ac) => {
            const sel = ac.icao === selectedIcao ? "selected" : "";
            const color = altColor(ac);
            const sub = [];
            if (ac.groundSpeedKt !== undefined) sub.push(`${ac.groundSpeedKt}kt ${vsArrow(ac.verticalRateFpm)}`);
            if (ac._distNm !== undefined) sub.push(`${ac._distNm.toFixed(0)}nm`);
            if (ac.squawk && EMERGENCY_SQUAWKS.has(ac.squawk)) sub.push(`<span class="emergency">SQK ${ac.squawk}</span>`);
            return `
            <div class="ac-row ${sel}" data-icao="${ac.icao}">
              <span class="swatch" style="background:${color}; color:${color}"></span>
              <span class="cs">${ac.callsign || ac.icao.toUpperCase()}</span>
              <span class="alt">${ac.altitudeFt !== undefined ? ac.altitudeFt.toLocaleString() + " ft" : "—"}</span>
              ${sub.length ? `<span class="sub">${sub.join(" · ")}</span>` : ""}
            </div>`;
          })
          .join("");
      }

      function selectAircraft(icao) {
        const prev = selectedIcao;
        selectedIcao = selectedIcao === icao ? null : icao;
        for (const id of [prev, selectedIcao]) {
          const entry = markers.get(id);
          if (entry) entry.marker.setIcon(iconFor(entry.ac));
        }
        const entry = markers.get(selectedIcao);
        if (entry) {
          map.setView(entry.marker.getLatLng(), Math.max(map.getZoom(), 8));
          entry.marker.openPopup();
        }
        document.querySelectorAll(".ac-row").forEach((row) => {
          row.classList.toggle("selected", row.dataset.icao === selectedIcao);
        });
      }

      listEl.addEventListener("click", (e) => {
        const row = e.target.closest(".ac-row");
        if (!row) return;
        selectAircraft(row.dataset.icao);
      });

      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        render();
      });
      sortSelect.addEventListener("change", () => {
        sortMode = sortSelect.value;
        render();
      });
      trailsToggle.addEventListener("change", () => {
        showTrails = trailsToggle.checked;
        if (!showTrails) {
          for (const line of trailLayers.values()) map.removeLayer(line);
          trailLayers.clear();
          trailPoints.clear();
        }
        render();
      });
      followToggle.addEventListener("change", () => {
        followSelected = followToggle.checked;
      });

      async function loadSiteInfo() {
        try {
          const r = await fetch("/api/feed-info");
          const info = await r.json();
          if (info.siteLat != null && info.siteLon != null) {
            site = { lat: info.siteLat, lon: info.siteLon, name: info.siteName };
            L.circleMarker([site.lat, site.lon], {
              radius: 6,
              color: "#34e2b0",
              weight: 2,
              fillColor: "#34e2b0",
              fillOpacity: 0.4,
            })
              .addTo(map)
              .bindPopup(site.name || "Receiver site");
            map.setView([site.lat, site.lon], 7);
          } else {
            const distOption = sortSelect.querySelector('option[value="distance"]');
            if (distOption) distOption.remove();
          }
        } catch {
          /* transient */
        }
      }

      async function refreshStats() {
        try {
          const r = await fetch("/api/stats");
          const s = await r.json();
          feedersEl.innerHTML = ["beast", "raw", "sbs"]
            .map((k) => {
              const f = s.feeders[k];
              return `<div class="feeder-row"><span>${k}</span><span>${f.connections} conn · ${f.totalFrames} msgs</span></div>`;
            })
            .join("");
        } catch {
          /* transient */
        }
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}/ws`);
        ws.onopen = () => {
          wsStateEl.textContent = "live";
          wsPillEl.classList.add("live");
          wsPillEl.classList.remove("down");
        };
        ws.onclose = () => {
          wsStateEl.textContent = "reconnecting…";
          wsPillEl.classList.remove("live");
          wsPillEl.classList.add("down");
          setTimeout(connect, 2000);
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "snapshot") updateAircraft(msg.aircraft, msg.now);
          } catch {
            /* ignore */
          }
        };
      }

      loadSiteInfo();
      connect();
      refreshStats();
      setInterval(refreshStats, 3000);
    </script>
  </body>
</html>
